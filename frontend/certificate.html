<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Certificate of Completion</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap');

    .cert-font {
      font-family: 'Playfair Display', serif;
    }

    .body-font {
      font-family: 'Inter', sans-serif;
    }

    @media print {

      #printBtn,
      #backBtn {
        display: none;
      }
    }
  </style>
</head>

<body
  class="bg-gradient-to-br from-blue-900 via-indigo-800 to-purple-900 min-h-screen flex flex-col items-center justify-center body-font p-6">

  <!-- Error message -->
  <div id="errorMsg" class="hidden text-white text-center text-xl mt-10"></div>

  <!-- Certificate Card -->
  <div id="certificateCard" class="hidden bg-white w-full max-w-3xl rounded-3xl shadow-2xl overflow-hidden">

    <!-- Gold top border -->
    <div class="h-3 bg-gradient-to-r from-yellow-400 via-yellow-300 to-yellow-500"></div>

    <div class="p-10 text-center space-y-4 relative">

      <!-- Decorative circles -->
      <div class="absolute top-4 left-4 w-16 h-16 rounded-full border-4 border-yellow-300 opacity-20"></div>
      <div class="absolute bottom-4 right-4 w-24 h-24 rounded-full border-4 border-yellow-300 opacity-20"></div>

      <!-- Logo / Platform name -->
      <p class="text-indigo-600 font-bold text-lg tracking-widest uppercase">LearnHub</p>

      <!-- Title -->
      <h1 class="cert-font text-4xl text-gray-800 leading-tight">Certificate of Completion</h1>

      <!-- Divider -->
      <div class="flex items-center justify-center gap-3 my-2">
        <div class="w-16 h-0.5 bg-yellow-400"></div>
        <span class="text-yellow-500 text-xl">★</span>
        <div class="w-16 h-0.5 bg-yellow-400"></div>
      </div>

      <p class="text-gray-500 text-base">This is proudly presented to</p>

      <!-- Student Name -->
      <h2 id="certStudentName" class="cert-font text-5xl text-indigo-700 mt-2"></h2>

      <p class="text-gray-500 mt-2">for successfully completing the course</p>

      <!-- Course Name -->
      <h3 id="certCourseName" class="text-2xl font-bold text-gray-800 mt-1"></h3>

      <!-- Teacher -->
      <p id="certTeacher" class="text-gray-400 text-sm mt-1"></p>

      <!-- Date -->
      <p id="certDate" class="text-gray-400 text-sm"></p>

      <!-- Buttons -->
      <div class="flex justify-center gap-4 mt-6">
        <button id="printBtn" onclick="window.print()"
          class="bg-indigo-600 text-white px-6 py-2 rounded-xl hover:bg-indigo-700 transition font-semibold">
          🖨️ Print / Save
        </button>
        <button id="backBtn" onclick="window.location.href='dashboard.html'"
          class="bg-gray-100 text-gray-700 px-6 py-2 rounded-xl hover:bg-gray-200 transition font-semibold">
          ← Dashboard
        </button>
      </div>

    </div>

    <!-- Gold bottom border -->
    <div class="h-3 bg-gradient-to-r from-yellow-500 via-yellow-300 to-yellow-400"></div>
  </div>

  <script src="./js/certificate.js"></script>
</body>

</html>
