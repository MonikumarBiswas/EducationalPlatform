<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

  <!-- Header -->
  <header class="bg-blue-600 text-white p-5 shadow-lg flex justify-between items-center">
    <button id="homeBtn" class="bg-white text-blue-600 px-4 py-2 rounded-lg font-semibold hover:bg-gray-100 transition">
      🏠 Home
    </button>
    <h1 class="text-2xl font-bold tracking-wide">Student Dashboard</h1>
    <button id="logoutBtn"
      class="bg-white text-blue-600 px-4 py-2 rounded-lg font-semibold hover:bg-gray-100 transition">
      Logout
    </button>
  </header>

  <main class="max-w-7xl mx-auto p-6 space-y-6">

    <!-- Student Info Card -->
    <section class="bg-white rounded-2xl shadow-md p-6 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-4">
        <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png"
          class="w-20 h-20 rounded-full border-4 border-blue-300 shadow">
        <div>
          <h2 class="text-xl font-bold text-gray-800" id="studentName">Loading...</h2>
          <p class="text-gray-500" id="studentEmail">Loading...</p>
        </div>
      </div>
      <div class="text-center bg-green-50 border border-green-200 rounded-xl px-6 py-3">
        <p class="text-sm text-gray-500">Bank Balance</p>
        <p class="text-3xl font-bold text-green-600" id="studentBalance">TK 0</p>
      </div>
    </section>

    <!-- Enrolled Courses -->
    <section class="bg-white rounded-2xl shadow-md p-6">
      <div id="cnumber" class="mb-4 text-lg font-bold text-gray-700">Enrolled Courses</div>
      <div id="enrolledCourses" class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <p class="text-gray-400">Loading courses...</p>
      </div>
    </section>

  </main>

  <script src="./js/dashboard.js"></script>
</body>

</html>
