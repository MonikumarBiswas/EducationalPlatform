<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload Course</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-blue-50 min-h-screen">

  <!-- Header -->
  <header class="bg-blue-600 text-white p-6 shadow-lg flex justify-between items-center">
    <button id="backbtn" class="bg-white text-blue-600 px-4 py-2 rounded-lg hover:bg-gray-100 transition">← Back</button>
    <h1 class="text-2xl font-bold">Upload New Course</h1>
    <span class="text-sm text-blue-100">Teacher Dashboard</span>
  </header>

  <!-- Form -->
  <main class="max-w-4xl mx-auto p-6">
    <form id="courseForm" enctype="multipart/form-data" class="bg-white rounded-2xl shadow-lg p-6 space-y-5">

      <!-- Title -->
      <div>
        <label class="block text-gray-700 font-medium mb-1">Course Title</label>
        <input type="text" name="title" required
          class="w-full border rounded-lg px-4 py-2 focus:ring focus:ring-blue-200">
      </div>

      <!-- Description -->
      <div>
        <label class="block text-gray-700 font-medium mb-1">Description</label>
        <textarea name="description" rows="3" required
          class="w-full border rounded-lg px-4 py-2 focus:ring focus:ring-blue-200"></textarea>
      </div>

      <!-- Price -->
      <div>
        <label class="block text-gray-700 font-medium mb-1">Price (TK)</label>
        <input type="number" name="price" required
          class="w-full border rounded-lg px-4 py-2 focus:ring focus:ring-blue-200">
      </div>

      <!-- Thumbnail & Video -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-gray-700 font-medium mb-1">Course Thumbnail (Image)</label>
          <input type="file" name="thumbnail" accept="image/*"
            class="w-full border rounded-lg px-3 py-2">
          <p class="text-xs text-gray-400 mt-1">This image will appear as course card thumbnail</p>
        </div>

        <div>
          <label class="block text-gray-700 font-medium mb-1">YouTube Embed URL</label>
          <input type="url" name="videoLink" placeholder="https://www.youtube.com/embed/VIDEO_ID"
            class="w-full border rounded-lg px-3 py-2">
          <p class="text-xs text-gray-400 mt-1">Paste the YouTube embed link (not watch link)</p>
        </div>

        <div>
          <label class="block text-gray-700 font-medium mb-1">Course Material URL</label>
          <input type="url" name="materials"
            class="w-full border rounded-lg px-3 py-2">
        </div>
      </div>

      <!-- Quiz Section -->
      <div class="border-t pt-4">
        <h2 class="text-lg font-bold text-gray-700 mb-3">📝 Quiz (5 Questions — MCQ)</h2>
        <p class="text-sm text-gray-500 mb-4">Add exactly 5 questions with 4 options each. Select the correct answer.</p>

        <div id="quizQuestions" class="space-y-6">
          <!-- Questions injected by JS -->
        </div>
      </div>

      <!-- Submit -->
      <button type="submit"
        class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition cursor-pointer font-bold text-lg">
        🚀 Upload Course
      </button>

    </form>
  </main>

  <script src="./js/uploadCourse.js"></script>
</body>
</html>
