<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload Course</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-blue-50 min-h-screen">

  <div class="w-full h-16 mb-4">
    <button id="backbtn"
      class="bg-blue-600 text-white px-4 py-2 rounded-xl  m-2  transition w-20 font-bold text-lg h-10">
      Back
    </button>
  </div>
  <!-- Header -->
  <header class="bg-blue-600 text-white p-6 shadow-lg text-center">
     
    <h1 class="text-2xl font-bold">Upload New Course</h1>
    <p class="text-sm text-blue-100">Teacher Dashboard</p>
  </header>

  <!-- Form -->
  <main class="max-w-4xl mx-auto p-6">
    <form id="courseForm"
      class="bg-white rounded-2xl shadow-lg p-6 space-y-5">

      <!-- Title -->
      <div>
        <label class="block text-gray-700 font-medium mb-1">Course Title</label>
        <input type="text" name="title" required
          class="w-full border rounded-lg px-4 py-2 focus:ring focus:ring-blue-200">
      </div>

      <!-- Description -->
      <div>
        <label class="block text-gray-700 font-medium mb-1">Description</label>
        <textarea name="description" rows="4" required
          class="w-full border rounded-lg px-4 py-2 focus:ring focus:ring-blue-200"></textarea>
      </div>

      <!-- Price -->
      <div>
        <label class="block text-gray-700 font-medium mb-1">Price (TK)</label>
        <input type="number" name="price" required
          class="w-full border rounded-lg px-4 py-2 focus:ring focus:ring-blue-200">
      </div>

      <!-- Files -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

        <div>
          <label class="block text-gray-700 font-medium mb-1">Thumbnail</label>
          <input type="file" name="thumbnail"
            class="w-full border rounded-lg px-3 py-2">
        </div>

        <div>
          <label class="block text-gray-700 font-medium mb-1">Video Link</label>
          <input type="url" name="videoLink"
            class="w-full border rounded-lg px-3 py-2">
        </div>

        

        <div>
          <label class="block text-gray-700 font-medium mb-1">Course Material</label>
          <input type="url" name="materials"
            class="w-full border rounded-lg px-3 py-2">
        </div>

       
      </div>

      <!-- Status -->
      <div>
        <label class="block text-gray-700 font-medium mb-1">Status</label>
        <select name="status"
          class="w-full border rounded-lg px-4 py-2">
          <option value="published">Published</option>
          <option value="draft">Draft</option>
        </select>
      </div>

      <!-- Submit -->
      <button type="submit"
        class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition cursor-pointer">
        Upload Course
      </button>

    </form>
  </main>

  <script src="./js/uploadCourse.js"></script>
</body>
</html>
